services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobforge}
      POSTGRES_USER: ${POSTGRES_USER:-jobforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the api/worker containers need to reach it, over the
    # internal compose network (service name "postgres"). Uncomment to inspect with a local
    # psql client: `ports: ["5432:5432"]`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobforge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/src/JobForge.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-jobforge};Username=${POSTGRES_USER:-jobforge};Password=${POSTGRES_PASSWORD:-jobforge}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      Jwt__Issuer: ${JWT_ISSUER:-JobForge}
      Jwt__Audience: ${JWT_AUDIENCE:-JobForge}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:3000}
      ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-true}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: worker/JobForge.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-jobforge};Username=${POSTGRES_USER:-jobforge};Password=${POSTGRES_PASSWORD:-jobforge}"
      Worker__WorkerId: ${WORKER_ID:-}
      Worker__PollIntervalSeconds: ${POLL_INTERVAL_SECONDS:-2}
      Worker__StaleExecutionThresholdSeconds: ${STALE_EXECUTION_THRESHOLD_SECONDS:-120}
      DOTNET_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    # Demonstrates multiple concurrent workers safely sharing the same PENDING queue —
    # try: docker compose up --build --scale worker=3
    deploy:
      replicas: 1

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
